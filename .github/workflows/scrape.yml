name: Scrape movie metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape movie cards
        run: python scraper.py

      - name: Commit updated movie list
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update movie metadata list"
          file_pattern: movies.json
